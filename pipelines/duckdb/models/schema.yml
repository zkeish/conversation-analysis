models:
  - name: s_cx_convo
    description: "Silver Layer"
    columns:
      - name: conversation_id
        description: "The primary key for this table"
        data_type: varchar
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "The ID for each unique customer"
        data_type: varchar

      - name: messages
        description: "The messages exchanged back and forth"
        data_type: json

      - name: metadata
        description: "metadata related to customer"
        data_type: json

      - name: resolution
        description: "Final resolution of conversation"
        data_type: json