models:
  - name: b_cx_convo
    description: "Bronze Layer - Raw conversation data ingestion"
    columns:
      - name: conversation_id
        description: "Unique conversation identifier"
        data_type: varchar
        data_tests:
          - not_null

      - name: customer_id
        description: "Customer identifier"
        data_type: varchar

      - name: messages
        description: "Array of message objects in the conversation"
        data_type: json

      - name: metadata
        description: "Conversation metadata as JSON object"
        data_type: json

      - name: resolution
        description: "Resolution information as JSON object"
        data_type: json

      - name: load_dtt
        description: "Load timestamp"
        data_type: timestamp

      - name: filename
        description: "Source filename"
        data_type: varchar

  - name: s_cx_convo_scd1
    description: "Silver Layer - Deduplicated conversations with SCD Type 1"
    columns:
      - name: conversation_id
        description: "The primary key for conversations"
        data_type: varchar
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "The ID for each unique customer"
        data_type: varchar

      - name: messages
        description: "Nested messages exchanged back and forth"
        data_type: json

      - name: metadata
        description: "Nested metadata related to customer"
        data_type: json

      - name: resolution
        description: "Nested final resolution of conversation"
        data_type: json

      - name: load_dtt
        description: "Load timestamp"
        data_type: timestamp

  - name: dim_cx_issue
    description: "Dimension table for customer issues"
    columns:
      - name: issue_key
        description: "Surrogate key for the issue"
        data_type: ubigint
        data_tests:
          - unique
          - not_null

      - name: conversation_key
        description: "Surrogate key for the conversation"
        data_type: ubigint
        data_tests:
          - not_null

      - name: primary_issue
        description: "Primary issue type"
        data_type: varchar

      - name: issue_type
        description: "Normalized issue type from metadata"
        data_type: varchar

      - name: secondary_issue
        description: "Secondary issue details"
        data_type: varchar

      - name: issue_resolved
        description: "Whether the issue was resolved"
        data_type: boolean

      - name: resolution_type
        description: "Type of resolution"
        data_type: varchar

      - name: resolution_notes
        description: "Notes on the resolution"
        data_type: varchar

      - name: issue_start_dtt
        description: "Timestamp when the issue started"
        data_type: timestamp

      - name: issue_resolved_dtt
        description: "Timestamp when the issue was resolved"
        data_type: timestamp

  - name: dim_cx_metadata
    description: "Dimension table for conversation metadata"
    columns:
      - name: conversation_key
        description: "Surrogate key for the conversation"
        data_type: ubigint
        data_tests:
          - unique
          - not_null

      - name: customer_key
        description: "Surrogate key for the customer"
        data_type: ubigint
        data_tests:
          - not_null

      - name: conversation_id
        description: "Conversation identifier"
        data_type: varchar
        data_tests:
          - not_null

      - name: customer_id
        description: "Customer identifier"
        data_type: varchar

      - name: category
        description: "Conversation category"
        data_type: varchar

      - name: issue_type
        description: "Type of issue"
        data_type: varchar

      - name: product
        description: "Product related to the conversation"
        data_type: varchar

      - name: status
        description: "Status of the conversation"
        data_type: varchar

      - name: priority
        description: "Priority level"
        data_type: varchar

      - name: conversation_first_message_dtt
        description: "Timestamp of the first message"
        data_type: timestamp

      - name: conversation_last_message_dtt
        description: "Timestamp of the last message"
        data_type: timestamp

      - name: day
        description: "Day of the conversation"
        data_type: varchar

      - name: has_curveball
        description: "Whether the conversation has a curveball"
        data_type: boolean

      - name: spans_multiple_days
        description: "Whether the conversation spans multiple days"
        data_type: boolean

      - name: is_multi_issue
        description: "Whether it's a multi-issue conversation"
        data_type: boolean

      - name: is_long_conversation
        description: "Whether it's a long conversation"
        data_type: boolean

  - name: fact_cx_message
    description: "Fact table for individual messages"
    columns:
      - name: message_key
        description: "Surrogate key for the message"
        data_type: ubigint
        data_tests:
          - unique
          - not_null

      - name: conversation_key
        description: "Surrogate key for the conversation"
        data_type: ubigint
        data_tests:
          - not_null

      - name: customer_key
        description: "Surrogate key for the customer"
        data_type: ubigint
        data_tests:
          - not_null

      - name: message_id
        description: "Original message identifier"
        data_type: varchar
        data_tests:
          - not_null

      - name: sender_role
        description: "Role of the sender (agent or customer)"
        data_type: varchar
        data_tests:
          - not_null

      - name: message_text
        description: "Content of the message"
        data_type: varchar

      - name: message_sent_dtt
        description: "Timestamp when the message was sent"
        data_type: timestamp
        data_tests:
          - not_null

  - name: mtc_cx_resolved
    description: "CX Layer - Resolved conversations with embeddings for ML models"
    columns:
      - name: conversation_key
        description: "Surrogate key for the conversation"
        data_type: ubigint
        data_tests:
          - unique
          - not_null

      - name: issue_type
        description: "Type of issue resolved"
        data_type: varchar

      - name: product_name
        description: "Product related to the resolved issue"
        data_type: varchar

      - name: resolution_type
        description: "Type of resolution applied"
        data_type: varchar

      - name: resolution_notes
        description: "Notes on the resolution"
        data_type: varchar

      - name: conversation_text
        description: "Full concatenated conversation text"
        data_type: varchar

      - name: embedding
        description: "Vector embedding of the conversation (768 dimensions)"
        data_type: float

  - name: vw_anomalies
    description: "CX Layer - View detecting anomalies and spikes in issue trends"
    columns:
      - name: issue_date
        description: "Date of the issue"
        data_type: date

      - name: issue_type
        description: "Type of issue"
        data_type: varchar

      - name: priority
        description: "Priority level of the issue"
        data_type: varchar

      - name: issue_count
        description: "Count of issues on the day"
        data_type: double

      - name: yesterdays_count
        description: "Count of issues on the previous day"
        data_type: double

      - name: average_2_day
        description: "Average issue count over 2-day baseline"
        data_type: double

      - name: day_over_day_change
        description: "Percentage change from yesterday"
        data_type: double

      - name: baseline_change
        description: "Percentage change from baseline average"
        data_type: double

      - name: spike_from_yesterday
        description: "Flag indicating spike from previous day threshold"
        data_type: boolean

      - name: spike_from_baseline
        description: "Flag indicating spike from baseline threshold"
        data_type: boolean
        data_tests:
          - not_null

  - name: vw_open_tickets
    description: "CX Layer - View of unresolved conversations with earliest customer message"
    columns:
      - name: conversation_key
        description: "Surrogate key for the conversation"
        data_type: ubigint
        data_tests:
          - not_null

      - name: issue_type
        description: "Type of the unresolved issue"
        data_type: varchar

      - name: product_name
        description: "Product related to the open ticket"
        data_type: varchar

      - name: message_text
        description: "Latest customer message in the conversation"
        data_type: varchar

      - name: message_sent_dtt
        description: "Timestamp of the latest customer message"
        data_type: timestamp